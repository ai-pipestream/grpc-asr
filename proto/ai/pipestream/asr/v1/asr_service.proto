// grpc-asr wire contract: streaming ASR over whisper.cpp for audio and
// video media, projecting timed transcript segments (and optional video
// keyframes) that gRParse maps into the Document data plane.
syntax = "proto3";

package ai.pipestream.asr.v1;

import "ai/pipestream/document/v1/document.proto";

// Streaming speech-to-text service backed by whisper.cpp.
//
// The product is the live event stream: segments are emitted as the
// decoder commits them so a client can render a growing transcript on a
// two-hour file. TranscriptComplete is a trailer with counts, not the
// payload.
service AsrService {
  // Bidirectional transcription stream.
  //
  // The client sends exactly one TranscribeOptions as the first message,
  // then the encoded media as MediaChunk messages, then half-closes.
  // The server replies with MediaInfo once the container is understood,
  // PartialSegment/FinalSegment events as the decoder commits text,
  // Keyframe events when requested for video, and a single
  // TranscriptComplete trailer.
  //
  // Errors: media above the configured byte or duration cap is
  // RESOURCE_EXHAUSTED; undecodable or truncated media is
  // INVALID_ARGUMENT (including video without an audio track); an
  // unknown model name is INVALID_ARGUMENT; an internal decoder fault is
  // INTERNAL.
  rpc Transcribe(stream TranscribeRequest) returns (stream TranscribeResponse);

  // Reports the server build, the available backend, and the models the
  // process loaded at startup.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
}

// One client-to-server message on the Transcribe stream.
message TranscribeRequest {
  // Exactly one payload kind per message.
  oneof payload {
    // Must be the first message on the stream and must not repeat.
    TranscribeOptions options = 1;
    // A chunk of the encoded media file, in file order.
    MediaChunk chunk = 2;
  }
}

// Per-stream transcription options, sent once as the first message.
message TranscribeOptions {
  // Whisper model identifier, e.g. "tiny", "tiny.en", "small", "medium",
  // "large-v3", "distil-large-v3". Must be one of the models this
  // process was configured to serve; unknown names fail with
  // INVALID_ARGUMENT rather than triggering a download.
  string model = 1;

  // ISO 639-1 hint for the spoken language, e.g. "en". Empty means
  // autodetect.
  string language = 2;

  // Whether to transcribe in the source language or translate to
  // English.
  Task task = 3;

  // When true, FinalSegment events carry per-word timings.
  bool word_timestamps = 4;

  // When true and the media has a video stream, the server emits
  // Keyframe events with PNG stills. Ignored for audio-only media.
  bool emit_keyframes = 5;

  // Minimum spacing between keyframes in seconds. Zero means the server
  // default. Only meaningful when emit_keyframes is true.
  uint32 keyframe_interval_seconds = 6;

  // When true, the server folds its own event stream into one
  // ai.pipestream.document.v1.Document and emits it as a document event
  // immediately before the TranscriptComplete trailer. The typed event
  // stream stays the lossless wire; the Document is the structural
  // projection every collector in the fleet offers, tagged with a
  // CollectorSource so downstream merges stay additive.
  bool emit_document = 7;

  // When true, the decoder is asked to detect speaker turns and segments
  // carry a speaker id. Off by default; a model without speaker-turn
  // training never predicts a turn, so every segment stays on the first
  // speaker.
  bool diarize = 8;

  // Original filename of the media, when the client knows one. Names the
  // folded Document and its origin; empty means the server derives a name
  // from the sniffed container.
  string filename = 9;

  // Transcribe through a remote, OpenAI-compatible
  // /audio/transcriptions endpoint instead of the local whisper.cpp pool
  // (docling's ApiAsrOptions). When set, `model`, `language` and
  // `word_timestamps` above are not used: the remote options carry their
  // own. Validated before any media byte is read; requires
  // GRPC_ASR_REMOTE_ALLOWED_HOSTS on the server (FAILED_PRECONDITION when
  // unset, PERMISSION_DENIED when the host or its resolved address is not
  // allowed, INVALID_ARGUMENT when options are malformed).
  RemoteTranscriptionOptions remote = 10;

  // Typed ASR preset. Unsupported presets are rejected even with `model` set.
  // When `model` is empty, a supported preset resolves to a whisper.cpp id.
  // An explicit model id overrides only a supported preset.
  optional AsrModelType model_type = 11;
  // Raw preset string when the closed enum has no match yet.
  optional string model_type_raw = 12;
  // Engine arm (docling AsrEngineConfig). Unset or WHISPER_CPP uses the
  // local pool; TRANSFORMERS / MLX_WHISPER / NATIVE_WHISPER are typed and
  // return UNIMPLEMENTED; REMOTE requires `remote` above.
  optional AsrEngineKind engine = 13;
  // At most one of remote, transformers, mlx_whisper, and native_whisper
  // may be set, and it must agree with an explicitly selected engine.
  // Inline transformers options (docling InlineAsrTransformersOptions).
  // Accepted on the wire; this build returns UNIMPLEMENTED when set.
  optional InlineAsrTransformersOptions transformers = 14;
  // mlx-whisper options including slim 2.145.0 fields. UNIMPLEMENTED here.
  optional InlineAsrMlxWhisperOptions mlx_whisper = 15;
  // openai-whisper native options. UNIMPLEMENTED here.
  optional InlineAsrNativeWhisperOptions native_whisper = 16;

  // Upper bound on the PCM window per decode pass, in seconds. Zero
  // means the server default. Smaller windows give earlier first
  // segments at the price of more re-decoded window edges; the server
  // clamps the value into its configured [min_window_seconds,
  // max_window_seconds] range.
  uint32 window_seconds = 17;

  // Local decoder settings. Unset means the server defaults.
  DecodingOptions decoding = 18;

  // How multi-channel audio is decoded. Unset is CHANNEL_MODE_MIXDOWN.
  ChannelMode channel_mode = 19;
}

// Decoder settings for the local whisper.cpp engine.
message DecodingOptions {
  // Text prepended to the decoder prompt to condition vocabulary and
  // style, e.g. names and acronyms expected in the media. Applied to
  // every window, since windows are decoded without context from their
  // predecessor. Capped at 1024 bytes.
  string initial_prompt = 1;
  // Sampling strategy; unset is greedy.
  SamplingStrategy strategy = 2;
  // Beam width for SAMPLING_STRATEGY_BEAM_SEARCH; 0 means the server
  // default of 5. Capped at 8; ignored for greedy.
  uint32 beam_size = 3;
  // Candidates per temperature step for greedy; 0 means the default.
  // Capped at 8.
  uint32 best_of = 4;
  // Segments where the no-speech probability exceeds this and the mean
  // token logprob is below logprob_threshold are reported with
  // Segment.suppressed = true instead of being dropped. Unset keeps
  // the decoder default (0.6).
  optional float no_speech_threshold = 5;
  // Mean token logprob threshold paired with no_speech_threshold. Unset
  // keeps the decoder default (-1.0).
  optional float logprob_threshold = 6;
  // Compression-ratio style entropy gate; unset keeps the default (2.4).
  optional float entropy_threshold = 7;
  // Suppress non-speech tokens (sound tags such as music markers).
  bool suppress_non_speech_tokens = 8;
}

// Local decoder token-sampling strategy.
enum SamplingStrategy {
  // Defaults to SAMPLING_STRATEGY_GREEDY.
  SAMPLING_STRATEGY_UNSPECIFIED = 0;
  // Greedy token selection at each temperature step.
  SAMPLING_STRATEGY_GREEDY = 1;
  // Beam search over beam_size candidates.
  SAMPLING_STRATEGY_BEAM_SEARCH = 2;
}

// How multi-channel audio is decoded.
enum ChannelMode {
  // Defaults to CHANNEL_MODE_MIXDOWN.
  CHANNEL_MODE_UNSPECIFIED = 0;
  // Mix every channel to mono and decode once.
  CHANNEL_MODE_MIXDOWN = 1;
  // Decode each source channel on its own; segments have `channel` and
  // speaker ids become C1, C2, ... (or C1-S1, ... when diarize is also
  // set). Capped by the server at GRPC_ASR_MAX_CHANNELS; above the cap
  // the request fails INVALID_ARGUMENT.
  CHANNEL_MODE_PER_CHANNEL = 2;
}

// Docling slim AsrModelFamily (transformers / NeMo families).
enum AsrModelFamily {
  // No explicit selection; use the enclosing request defaults.
  ASR_MODEL_FAMILY_UNSPECIFIED = 0;
  // Whisper selection.
  ASR_MODEL_FAMILY_WHISPER = 1;
  // Granite selection.
  ASR_MODEL_FAMILY_GRANITE = 2;
  // Granite ctc selection.
  ASR_MODEL_FAMILY_GRANITE_CTC = 3;
  // Parakeet selection.
  ASR_MODEL_FAMILY_PARAKEET = 4;
  // Nemotron selection.
  ASR_MODEL_FAMILY_NEMOTRON = 5;
}

// Subset of the 2.145.0 preset vocabulary. Other names use model_type_raw.
// Explicit native and S2T model-size presets are not yet enumerated here.
enum AsrModelType {
  // No explicit selection; use the enclosing request defaults.
  ASR_MODEL_TYPE_UNSPECIFIED = 0;
  // Whisper tiny selection.
  ASR_MODEL_TYPE_WHISPER_TINY = 1;
  // Whisper small selection.
  ASR_MODEL_TYPE_WHISPER_SMALL = 2;
  // Whisper medium selection.
  ASR_MODEL_TYPE_WHISPER_MEDIUM = 3;
  // Whisper base selection.
  ASR_MODEL_TYPE_WHISPER_BASE = 4;
  // Whisper large selection.
  ASR_MODEL_TYPE_WHISPER_LARGE = 5;
  // Whisper turbo selection.
  ASR_MODEL_TYPE_WHISPER_TURBO = 6;
  // Whisper tiny mlx selection.
  ASR_MODEL_TYPE_WHISPER_TINY_MLX = 7;
  // Whisper small mlx selection.
  ASR_MODEL_TYPE_WHISPER_SMALL_MLX = 8;
  // Whisper medium mlx selection.
  ASR_MODEL_TYPE_WHISPER_MEDIUM_MLX = 9;
  // Whisper base mlx selection.
  ASR_MODEL_TYPE_WHISPER_BASE_MLX = 10;
  // Whisper large mlx selection.
  ASR_MODEL_TYPE_WHISPER_LARGE_MLX = 11;
  // Whisper turbo mlx selection.
  ASR_MODEL_TYPE_WHISPER_TURBO_MLX = 12;
  // Local generic Python Whisper selector; not an upstream preset name.
  ASR_MODEL_TYPE_WHISPER_NATIVE = 13;
  // Local generic WhisperS2T selector; not an upstream preset name.
  ASR_MODEL_TYPE_WHISPER_S2T = 14;
  // Granite speech 5 0 2b selection.
  ASR_MODEL_TYPE_GRANITE_SPEECH_5_0_2B = 15;
  // Granite speech 5 0 470m turboctc selection.
  ASR_MODEL_TYPE_GRANITE_SPEECH_5_0_470M_TURBOCTC = 16;
  // Granite speech 5 0 470m turboctc nc selection.
  ASR_MODEL_TYPE_GRANITE_SPEECH_5_0_470M_TURBOCTC_NC = 17;
  // Granite speech 4 1 2b selection.
  ASR_MODEL_TYPE_GRANITE_SPEECH_4_1_2B = 18;
  // Granite speech 4 1 2b plus selection.
  ASR_MODEL_TYPE_GRANITE_SPEECH_4_1_2B_PLUS = 19;
  // Nemotron speech streaming en 0 6b selection.
  ASR_MODEL_TYPE_NEMOTRON_SPEECH_STREAMING_EN_0_6B = 20;
  // Parakeet ctc 1 1b selection.
  ASR_MODEL_TYPE_PARAKEET_CTC_1_1B = 21;
  // Granite 4 0 1b speech selection.
  ASR_MODEL_TYPE_GRANITE_4_0_1B_SPEECH = 22;
  // Nemotron 3 5 asr streaming selection.
  ASR_MODEL_TYPE_NEMOTRON_3_5_ASR_STREAMING = 23;
  // Whisper tiny transformers selection.
  ASR_MODEL_TYPE_WHISPER_TINY_TRANSFORMERS = 24;
  // Whisper base transformers selection.
  ASR_MODEL_TYPE_WHISPER_BASE_TRANSFORMERS = 25;
  // Whisper small transformers selection.
  ASR_MODEL_TYPE_WHISPER_SMALL_TRANSFORMERS = 26;
  // Whisper medium transformers selection.
  ASR_MODEL_TYPE_WHISPER_MEDIUM_TRANSFORMERS = 27;
  // Whisper large transformers selection.
  ASR_MODEL_TYPE_WHISPER_LARGE_TRANSFORMERS = 28;
  // Whisper turbo transformers selection.
  ASR_MODEL_TYPE_WHISPER_TURBO_TRANSFORMERS = 29;
}

// Engine arm for ASR (docling AsrEngineConfig / inline vs API).
enum AsrEngineKind {
  // No explicit selection; use the enclosing request defaults.
  ASR_ENGINE_KIND_UNSPECIFIED = 0;
  // Whisper cpp selection.
  ASR_ENGINE_KIND_WHISPER_CPP = 1;       // local whisper.cpp pool
  // Transformers selection.
  ASR_ENGINE_KIND_TRANSFORMERS = 2;     // not served: UNIMPLEMENTED
  // Mlx whisper selection.
  ASR_ENGINE_KIND_MLX_WHISPER = 3;      // not served: UNIMPLEMENTED
  // Native whisper selection.
  ASR_ENGINE_KIND_NATIVE_WHISPER = 4;   // not served: UNIMPLEMENTED
  // Remote selection.
  ASR_ENGINE_KIND_REMOTE = 5;           // requires RemoteTranscriptionOptions
}

// Options for a Transformers ASR backend; unavailable in this collector.
message InlineAsrTransformersOptions {
  // Model repository revision.
  optional string revision = 1;
  // Model architecture family.
  optional AsrModelFamily model_family = 2;
  // Original family name when the enum has no matching value.
  optional string model_family_raw = 3;
  // Prompt supplied to the model.
  optional string prompt = 4;
  // Requested transcription language.
  optional string language = 5;
  // Requested transcription or translation task.
  optional Task task = 6;
  // Original task name when the enum has no matching value.
  optional string task_raw = 7;
}

// Options for an MLX Whisper backend; unavailable in this collector.
message InlineAsrMlxWhisperOptions {
  // Unset leaves the mlx-whisper default (true); explicit false is distinct.
  optional bool condition_on_previous_text = 1;
  // Silence threshold in seconds used by the MLX backend.
  optional double hallucination_silence_threshold = 2;
  // Initial prompt supplied to the MLX backend.
  optional string initial_prompt = 3;
}

// Options for the Python Whisper backend; unavailable in this collector.
message InlineAsrNativeWhisperOptions {
  // Whether later windows are conditioned on previous text.
  optional bool condition_on_previous_text = 1;
}

// Options for a remote, OpenAI-compatible transcription service: the
// typed form of docling's ApiAsrOptions. The media is posted as
// multipart/form-data with response_format=verbose_json, and the timed
// segments of the answer become Segment events.
message RemoteTranscriptionOptions {
  // Transcription endpoint, e.g. http://whisper:8000/v1/audio/transcriptions.
  // Required; http or https only, with a non-empty host, an optional port
  // in 1-65535 and no userinfo (credentials go in `headers`).
  string url = 1;
  // HTTP headers sent with the request, e.g. Authorization. Names must be
  // HTTP tokens and unique ignoring case; values must not contain CR or LF.
  map<string, string> headers = 2;
  // Value of the `model` form field. Unset or empty omits the field.
  optional string model = 3;
  // ISO 639-1 language of the audio, sent as `language`. Unset or empty
  // omits the field so the server detects the language.
  optional string language = 4;
  // Sent as the `prompt` form field to condition style or vocabulary.
  // Unset or empty omits the field.
  optional string initial_prompt = 5;
  // Ask for word timestamps: timestamp_granularities[] = segment and word.
  bool word_timestamps = 6;
  // Additional form fields for service-specific settings (temperature,
  // vad_filter, ...), typed. A bool is sent as "true"/"false". The key
  // response_format is ignored: verbose_json is required for timings.
  // Keys must be non-empty and every value must set its kind.
  map<string, ScalarValue> params = 7;
  // Seconds to wait for the answer. Unset means 600 (docling's default);
  // a set value must be greater than zero and at most 3600.
  optional double timeout_seconds = 8;
}

// One typed scalar where the upstream model holds dict[str, Any]. Same
// shape as ai.pipestream.parse.v1.ScalarValue in gRParse.
message ScalarValue {
  // Exactly one kind; an unset kind is rejected where a value is required.
  oneof kind {
    // A text value, sent as is.
    string string_value = 1;
    // A signed integer, sent in decimal.
    int64 int_value = 2;
    // A float, sent as Python's str() prints it (0.0, 0.25).
    double double_value = 3;
    // A boolean, sent as "true" or "false".
    bool bool_value = 4;
    // Integers above int64 range.
    uint64 uint_value = 5;
  }
}

// Whisper decoding task.
enum Task {
  // Defaults to TASK_TRANSCRIBE.
  TASK_UNSPECIFIED = 0;
  // Transcribe in the language spoken in the media.
  TASK_TRANSCRIBE = 1;
  // Translate the speech to English while transcribing.
  TASK_TRANSLATE = 2;
}

// A chunk of the encoded input media (the bytes of the file as stored,
// not PCM). Chunks arrive in order; the server buffers only the encoded
// form and decodes in bounded windows.
message MediaChunk {
  // Raw bytes of the media file, in order.
  bytes data = 1;
}

// One server-to-client event on the Transcribe stream.
message TranscribeResponse {
  // Exactly one event kind per message.
  oneof event {
    // First event: what the demuxer found in the container.
    MediaInfo media_info = 1;
    // A segment the decoder may still revise; replaced by a
    // FinalSegment with the same index.
    Segment partial_segment = 2;
    // A committed segment. Final segments for a given index supersede
    // any partial with that index and are never revised.
    Segment final_segment = 3;
    // A video still, only when TranscribeOptions.emit_keyframes was set
    // and the media has video.
    Keyframe keyframe = 4;
    // Trailer: aggregate counts for the finished transcript.
    TranscriptComplete complete = 5;
    // The transcript folded into the Document data plane: one per stream,
    // emitted immediately before the complete trailer, only when
    // TranscribeOptions.emit_document was set. Final segments become text
    // items located by time provenance (ProvenanceItem.time, one entry for
    // the segment and one per word) and attributed to the collector
    // (CollectorSource, collector "asr"); keyframes become picture items
    // whose ImageRef.uri points back at the typed Keyframe event
    // ("keyframe:<timestamp_ms>") instead of embedding PNG bytes, so the
    // Document stays one bounded message.
    ai.pipestream.document.v1.Document document = 6;
  }
}

// Container-level facts discovered before transcription starts.
message MediaInfo {
  // Total media duration in milliseconds, zero when the container does
  // not declare it.
  uint64 duration_ms = 1;
  // Audio codec name as reported by the demuxer, e.g. "pcm_s16le",
  // "aac", "mp3".
  string audio_codec = 2;
  // Source sample rate in hertz, before resampling to the model rate.
  uint32 sample_rate_hz = 3;
  // Number of audio channels in the source.
  uint32 channels = 4;
  // True when the container also has a video stream.
  bool has_video = 5;
  // Video codec name when has_video is true, empty otherwise.
  string video_codec = 6;
  // Container family the server sniffed from the first bytes (or matched
  // from the filename extension fallback).
  ContainerFamily container = 7;
}

// Media container family recognized by the server.
enum ContainerFamily {
  // Unknown or unrecognized container family.
  CONTAINER_FAMILY_UNSPECIFIED = 0;
  // RIFF WAVE audio.
  CONTAINER_FAMILY_WAV = 1;
  // MPEG-1/2/2.5 Layer III audio (with or without ID3v2).
  CONTAINER_FAMILY_MP3 = 2;
  // Free Lossless Audio Codec.
  CONTAINER_FAMILY_FLAC = 3;
  // Ogg container (Opus, Vorbis).
  CONTAINER_FAMILY_OGG = 4;
  // ISO Base Media File Format (MP4, M4A, M4V, QuickTime MOV).
  CONTAINER_FAMILY_MP4 = 5;
  // EBML container (Matroska MKV, WebM).
  CONTAINER_FAMILY_MATROSKA = 6;
  // Audio Video Interleave (RIFF AVI).
  CONTAINER_FAMILY_AVI = 7;
  // Advanced Systems Format (WMA, WMV).
  CONTAINER_FAMILY_ASF = 8;
  // Adaptive Multi-Rate audio (AMR-NB, AMR-WB).
  CONTAINER_FAMILY_AMR = 9;
  // MPEG-1/2 Program Stream (MPG, MPEG).
  CONTAINER_FAMILY_MPEG_PS = 10;
  // MPEG-2 Transport Stream (TS).
  CONTAINER_FAMILY_MPEG_TS = 11;
  // Audio Data Transport Stream raw AAC.
  CONTAINER_FAMILY_ADTS_AAC = 12;
}

// A timed span of transcribed text.
message Segment {
  // Zero-based segment index; finals replace partials by this index.
  uint32 index = 1;
  // Segment start in milliseconds from the beginning of the media.
  uint64 start_ms = 2;
  // Segment end in milliseconds from the beginning of the media.
  uint64 end_ms = 3;
  // Transcribed (or translated) text for the span.
  string text = 4;
  // Per-word timings, present only on final segments when
  // TranscribeOptions.word_timestamps was set.
  repeated Word words = 5;
  // Mean log-probability of the segment's tokens. Absent when the segment
  // decoded no scored token; a present 0 is a real score (a segment the
  // decoder was certain of), never a stand-in for "unknown".
  optional float avg_logprob = 6;
  // Decoder probability that the span contains no speech, in [0, 1].
  optional float no_speech_prob = 7;
  // True when the decoder predicted a speaker change at the end of this
  // segment. Only ever true when TranscribeOptions.diarize was set.
  bool speaker_turn_next = 8;
  // Speaker attributed to this segment, as a stream-local label ("S1",
  // "S2", ... or "C1", "C2", ... under per-channel mode). Empty when
  // neither diarization nor per-channel mode is active.
  string speaker_id = 9;
  // True when the server's hallucination gate flagged this segment
  // (no_speech_prob above and avg_logprob below the configured
  // thresholds). The text is still delivered on the typed stream; the
  // Document fold skips flagged segments.
  bool suppressed = 10;
  // Zero-based source channel the segment was decoded from; only set
  // under CHANNEL_MODE_PER_CHANNEL.
  uint32 channel = 11;
  // ISO 639-1 code the decoder detected (or was given) for the window
  // this segment came from, e.g. "en".
  string language = 12;
}

// A single word with its timing inside a segment.
message Word {
  // The word text, including leading whitespace as whisper emits it.
  string text = 1;
  // Word start in milliseconds from the beginning of the media.
  uint64 start_ms = 2;
  // Word end in milliseconds from the beginning of the media.
  uint64 end_ms = 3;
  // Token-level probability for the word; 0 when unknown.
  float probability = 4;
}

// A still frame extracted from the video stream.
message Keyframe {
  // Frame timestamp in milliseconds from the beginning of the media.
  uint64 timestamp_ms = 1;
  // PNG-encoded frame bytes.
  bytes png = 2;
  // Frame width in pixels.
  uint32 width = 3;
  // Frame height in pixels.
  uint32 height = 4;
}

// Trailer summarizing the finished transcription.
message TranscriptComplete {
  // Detected or requested language as ISO 639-1, e.g. "en".
  string language = 1;
  // Transcribed media duration in milliseconds.
  uint64 duration_ms = 2;
  // Total number of final segments emitted.
  uint32 segment_count = 3;
  // Total decoded token count across all final segments.
  uint64 token_count = 4;
  // Total keyframes emitted; zero for audio-only media or when
  // keyframes were not requested.
  uint32 keyframe_count = 5;
  // Effective upper bound on the PCM window per decode pass in seconds,
  // after server clamping; zero on the remote path.
  uint32 window_seconds = 6;
  // Final segment count per source channel in channel order (0..N-1)
  // when CHANNEL_MODE_PER_CHANNEL is active; empty in mixdown mode.
  repeated uint32 segment_count_by_channel = 7;
  // Every distinct language seen across the final segments, in first
  // appearance order; `language` stays the first one.
  repeated string languages = 8;
}

// Request for GetServiceInfo. Empty by design.
message GetServiceInfoRequest {}

// Build and capability facts for this server process.
message GetServiceInfoResponse {
  // Semantic version of this server build.
  string version = 1;
  // whisper.cpp revision compiled into the binary.
  string whisper_version = 2;
  // Active compute backend: "cuda", "openvino", or "cpu". The backend
  // is fixed at startup and never silently substituted.
  string backend = 3;
  // Model identifiers this process loaded at startup, e.g. "tiny.en".
  repeated string models = 4;
  // Maximum accepted encoded media size in bytes; larger inputs fail
  // with RESOURCE_EXHAUSTED.
  uint64 max_media_bytes = 5;
  // Maximum accepted media duration in milliseconds; longer inputs fail
  // with RESOURCE_EXHAUSTED.
  uint64 max_duration_ms = 6;
  // Frontend advertisement for the shared demo shell, which reads it to
  // build its tab bar.
  UiInfo ui = 7;
  // Minimum PCM window length in seconds the server starts a stalled
  // decode pass with, and the lower bound for TranscribeOptions.window_seconds.
  uint32 min_window_seconds = 11;
  // Maximum PCM window length in seconds per decode pass, and the upper
  // bound for TranscribeOptions.window_seconds.
  uint32 max_window_seconds = 12;
  // True when every loaded whisper state ran a startup warmup inference.
  bool warmed_up = 13;
  // True when GRPC_ASR_REMOTE_ALLOWED_HOSTS is non-empty so
  // TranscribeOptions.remote requests are enabled on this server.
  bool remote_enabled = 14;
}

// Frontend advertisement. Same shape in every ai-pipestream grpc service:
// the demo shell reads it to build its tab bar.
message UiInfo {
  // Tab title, e.g. "ASR".
  string title = 1;
  // Shell mount path, e.g. "/ui/asr".
  string path = 2;
  // One line, used as the tab tooltip.
  string description = 3;
}
