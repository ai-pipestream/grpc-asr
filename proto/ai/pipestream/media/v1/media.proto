syntax = "proto3";

package ai.pipestream.media.v1;

import "google/protobuf/timestamp.proto";

// Diskless media ingress and machine-scoped event subscriptions.
service MediaService {
  // Inspect this ingress instance without creating or subscribing to a stream.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);
  // Open once, send ordered chunks, then explicitly finish; results stream back.
  rpc Ingest(stream IngestRequest) returns (stream IngestResponse);
  // Pull a permitted HTTP source; response EOF produces explicit stream closure.
  rpc Pull(PullRequest) returns (stream PullResponse);
  // Hydrate matching streams at a consistent boundary, then follow live events.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

// No stream or model must be opened to discover ingress configuration.
message GetServiceInfoRequest {}

// Instance identity and configured ingress limits, not downstream readiness.
message GetServiceInfoResponse {
  // Same instance identity used on ingress events.
  Producer producer = 1;
  // Changes when the in-memory stream registry restarts.
  string server_epoch = 2;
  // Maximum accepted source chunk size in bytes.
  uint64 max_chunk_bytes = 3;
  // Maximum history bytes retained per stream.
  uint64 retention_bytes = 4;
  // Maximum queued bytes per subscriber before that subscriber is disconnected.
  uint64 subscriber_queue_bytes = 5;
  // Maximum active plus retained closed streams.
  uint64 max_streams = 6;
  // Maximum simultaneously registered subscribers.
  uint64 max_subscribers = 7;
  // True when at least one HTTP origin is allowed; individual URLs still require validation.
  bool http_pull_configured = 8;
  // True when a speech processor is configured; does not assert worker availability.
  bool speech_processing_configured = 9;
  // Optional web UI descriptor. Absent when this deployment has no web UI.
  UiInfo ui = 10;
  // Minimum configured window_ms minus overlap_ms for the speech processor.
  // Absent when no such policy is configured. Short final windows remain valid.
  optional uint32 minimum_window_advance_ms = 11;
}

// Shared shape used by service UIs across the parser family.
message UiInfo {
  // Display title of the service's web UI.
  string title = 1;
  // Suggested mount path.
  string path = 2;
  // One-line description of the UI.
  string description = 3;
}

// HTTP source and optional media/speech processing configuration.
message PullRequest {
  // Must select the HTTP source variant; credentials are server controlled.
  OpenStream open = 1;
}

// Identical event vocabulary to direct ingestion and independent subscriptions.
message PullResponse {
  // Source bytes, derived results and lifecycle events from the pull.
  StreamEvent event = 1;
}

// One client message on the ingress connection.
message IngestRequest {
  // Opening and finishing are explicit protocol messages.
  oneof payload {
    // Required first; repeated opens are invalid.
    OpenStream open = 1;
    // Direct upload only; sequence and byte offset must be contiguous.
    SourceChunk chunk = 2;
    // Flush and finalize; an unexpected disconnect is not successful completion.
    FinishStream finish = 3;
  }
}

// One result on the ingress connection.
message IngestResponse {
  // Same envelope used by independent subscribers.
  StreamEvent event = 1;
}

// Request to follow a machine's published streams.
message SubscribeRequest {
  // Optional UUID allowlist. Empty selects all authorized streams, including future ones.
  repeated string stream_ids = 1;
  // Specifies metadata and bounded history to send before live delivery.
  Hydration hydration = 2;
  // Restricts payload types; empty selects every payload type.
  repeated PayloadKind payload_kinds = 3;
}

// Payload classes for a subscription; lifecycle and hydration boundaries are always sent.
enum PayloadKind {
  // Invalid as an explicit filter entry.
  PAYLOAD_KIND_UNSPECIFIED = 0;
  // Byte-identical incoming media, before decoding or remuxing.
  PAYLOAD_KIND_SOURCE = 1;
  // Decoded audio suitable for chained model services.
  PAYLOAD_KIND_AUDIO = 2;
  // Speech transcription or English translation results.
  PAYLOAD_KIND_TRANSCRIPT = 3;
  // Container and track descriptions, including later metadata updates.
  PAYLOAD_KIND_MEDIA_INFO = 4;
  // Demuxed compressed packets, including video, audio and subtitle tracks.
  PAYLOAD_KIND_PACKET = 5;
  // Unreconciled model output, distinct from finalized transcript revisions.
  PAYLOAD_KIND_HYPOTHESIS = 6;
  // Sanitized HTTP response metadata, without request secrets or cookies.
  PAYLOAD_KIND_HTTP_INFO = 7;
}

// Bounded hydration policy; this does not imply durable storage.
message Hydration {
  // Include current stream description, producer and model identities.
  bool metadata = 1;
  // Include retained events newer than the optional per-stream cursors.
  bool retained_events = 2;
  // Resume positions. Reject stale epochs or unavailable history instead of hiding gaps.
  repeated Cursor after = 3;
}

// A subscriber receives lifecycle boundaries and a single ordered event stream.
message SubscribeResponse {
  // Hydration is delimited separately from per-stream event numbering.
  oneof payload {
    // The snapshot high-water marks; live events follow these positions.
    SnapshotBegin snapshot_begin = 1;
    // Hydrated metadata; does not consume a stream event sequence number.
    StreamSnapshot snapshot = 2;
    // A retained or live stream event, retaining its original identity.
    StreamEvent event = 3;
    // All selected retained events through the high-water marks have been sent.
    SnapshotEnd snapshot_end = 4;
  }
}

// A stable event position within one server incarnation.
message Cursor {
  // UUID assigned on server startup; changes on restart.
  string server_epoch = 1;
  // Subscription UUID. A closed UUID can be reopened after its state is evicted.
  string stream_id = 2;
  // Monotonic per-stream event number, beginning at one.
  uint64 event_sequence = 3;
  // Unique opening incarnation. Required on replay cursors; prevents a reopened
  // caller UUID from aliasing an older stream's history.
  string stream_incarnation = 4;
}

// Beginning of an atomic hydration-to-live subscription.
message SnapshotBegin {
  // Unique ID matching SnapshotEnd.
  string snapshot_id = 1;
  // Frozen positions for the streams present when the subscription was registered.
  repeated Cursor through = 2;
}

// End of hydration; events newer than the frozen positions follow.
message SnapshotEnd {
  // Matches the corresponding SnapshotBegin.
  string snapshot_id = 1;
}

// The current description of one stream at a snapshot boundary.
message StreamSnapshot {
  // Latest event represented by this state.
  Cursor through = 1;
  // First event still available in memory; may be greater than one.
  uint64 first_retained_sequence = 2;
  // Original handshake, with input credentials excluded.
  StreamOpened opened = 3;
  // Present only if the stream has reached a terminal state.
  StreamClosed closed = 4;
  // Producers participating in this stream, including actual model identities.
  repeated Producer producers = 5;
  // Latest retained revision of each speech segment as of the snapshot boundary.
  repeated TranscriptSegment transcripts = 6;
  // True if older result state was evicted; transcripts is not a complete history.
  bool result_state_truncated = 7;
  // Most recently observed container and track descriptions.
  MediaInfo media_info = 8;
  // Bounded most-recent worker hypotheses; these are not a combined transcript.
  repeated SpeechHypothesis hypotheses = 9;
  // HTTP response information when the source was pulled by the server.
  HttpResponseInfo http_info = 10;
}

// Initial input declaration.
message OpenStream {
  // Optional caller UUID; the server generates one when absent and rejects collisions.
  string stream_id = 1;
  // Source identity and optional HTTP pull configuration.
  oneof source {
    // Caller uploads bytes using SourceChunk messages.
    DirectSource direct = 2;
    // Server pulls an HTTP(S) response incrementally under its configured URL policy.
    HttpSource http = 3;
  }
  // Requested downstream processing; empty means lossless source relay only.
  repeated SpeechOptions speech = 4;
  // Optional native media output projections. Speech requests decode internally
  // even when this message is absent; original bytes are preserved either way.
  DecodeOptions decode = 5;
}

// Native media processing to perform alongside byte-preserving relay.
message DecodeOptions {
  // Publish mono 16 kHz float32 PCM for speech workers.
  bool emit_audio = 1;
  // Publish demuxed packets for all tracks, without transcoding video.
  bool emit_packets = 2;
  // Audio tracks to decode by container index. Empty selects all audio tracks.
  repeated uint32 audio_track_ids = 3;
}

// Direct gRPC media upload.
message DirectSource {
  // User-facing source name, never a server filesystem path.
  string name = 1;
  // Informational media type hint; the native decoder detects actual content.
  string media_type = 2;
}

// HTTP pull input. Request secrets must never appear in published metadata.
message HttpSource {
  // HTTP(S) URL; redirects and each resolved destination require policy validation.
  string url = 1;
  // Opaque server-configured credential reference, not a credential value.
  string credential_profile = 2;
}

// Exact source bytes; transport boundaries need not be codec or keyframe boundaries.
message SourceChunk {
  // Contiguous source chunk number, starting at one.
  uint64 chunk_number = 1;
  // Zero-based position in the original byte stream.
  uint64 byte_offset = 2;
  // Unmodified source bytes, subject to the server's advertised message limit.
  bytes data = 3;
  // Optional SHA-256 supplied by the client; exactly 32 bytes when present.
  bytes sha256 = 4;
}

// Explicit input completion, distinct from a cancelled or broken connection.
message FinishStream {
  // Must equal the number of accepted source chunks.
  uint64 chunk_count = 1;
  // Must equal the number of accepted source bytes.
  uint64 byte_count = 2;
  // Optional SHA-256 of the complete source byte stream.
  bytes sha256 = 3;
}

// Options for one speech-processing stage.
message SpeechOptions {
  // Server-registered model identity; never a filesystem path or download URL.
  string model_id = 1;
  // BCP-47 language hint; empty means model-supported autodetection.
  string language = 2;
  // Recognition or translation task.
  SpeechTask task = 3;
  // Include supported word/token timing and probability information.
  bool word_timestamps = 4;
  // Decoded-audio inference windows; does not change original source chunks.
  SpeechWindowing windowing = 5;
  // Ingress publishes reconciled revisions by default; false requests raw hypotheses
  // only. Reconciliation enables token timings in the resolved opening options.
  // The native worker always returns raw hypotheses and ignores this ingress option.
  optional bool reconcile_transcript = 6;
}

// Audio-window policy, resolved and echoed in StreamOpened.
message SpeechWindowing {
  // Target inference window duration in milliseconds. Absent uses the server
  // default; explicit zero is invalid. Subject to the model's context limit.
  optional uint32 window_ms = 1;
  // Audio repeated in fixed windows or on a forced speech-aware split. Absent
  // uses the server default; zero disables overlap for fixed windows. Must be
  // smaller than window_ms by at least the discovered minimum advance.
  // Normal pause-based cuts do not repeat audio.
  optional uint32 overlap_ms = 2;
  // Fixed-duration windows or speech-aware boundaries.
  ChunkingStrategy strategy = 3;
  // Required for speech-aware mode; rejected in fixed-duration mode.
  SpeechBoundaryOptions speech_boundary = 4;
}

// How decoded audio is divided into inference windows.
enum ChunkingStrategy {
  // Uses the server default; the handshake always reports a concrete strategy.
  CHUNKING_STRATEGY_UNSPECIFIED = 0;
  // Fixed-duration windows with optional overlap.
  CHUNKING_STRATEGY_FIXED = 1;
  // Prefer detected non-speech intervals near the target duration.
  CHUNKING_STRATEGY_SPEECH_AWARE = 2;
}

// Voice-activity-based boundary selection; detection is probabilistic.
message SpeechBoundaryOptions {
  // Server-registered VAD model, with its actual identity included in provenance.
  string vad_model_id = 1;
  // Minimum consecutive detected non-speech time required for a candidate cut.
  // Must be positive. Detector lookahead contributes additional latency.
  uint32 min_pause_ms = 2;
  // Context retained on each side of detected speech. Cut only in the interior
  // of a pause after allowing this margin at both ends; no audio is discarded.
  uint32 speech_padding_ms = 3;
  // Hard maximum window duration, including any fallback overlap. Must be at
  // least window_ms and within the speech model's context limit.
  uint32 max_window_ms = 4;
  // Required behavior when no safe candidate is found before the hard limit.
  NoPausePolicy no_pause_policy = 5;
}

// Explicit response to continuous speech or uncertain pause detection.
enum NoPausePolicy {
  // Invalid in an accepted speech-aware configuration.
  NO_PAUSE_POLICY_UNSPECIFIED = 0;
  // Split at the hard limit with positive overlap_ms, marking the forced cut.
  NO_PAUSE_POLICY_SPLIT_WITH_OVERLAP = 1;
  // Stop speech processing with RESOURCE_EXHAUSTED rather than cut known speech.
  NO_PAUSE_POLICY_FAIL = 2;
}

// Speech tasks supported by the Whisper backend.
enum SpeechTask {
  // Resolves to transcription, and the resolved task is reported in the handshake.
  SPEECH_TASK_UNSPECIFIED = 0;
  // Preserve the spoken language.
  SPEECH_TASK_TRANSCRIBE = 1;
  // Translate speech to English; arbitrary target languages require another model.
  SPEECH_TASK_TRANSLATE_TO_ENGLISH = 2;
}

// Identity of the software and model that produced an event.
message Producer {
  // Machine UUID, stable across restarts when configured by the operator.
  string machine_id = 1;
  // Service name.
  string service = 2;
  // Application release version.
  string app_version = 3;
  // Source revision or immutable build identity.
  string build_id = 4;
  // Backend library and its version, for example whisper.cpp or libavformat.
  string library_version = 5;
  // Actual execution backend, for example CPU, CUDA, Metal, or OpenVINO.
  string execution_backend = 6;
  // Loaded model ID; empty for non-model processing stages.
  string model_id = 7;
  // SHA-256 of loaded model content; absent for non-model stages.
  bytes model_sha256 = 8;
  // SHA-256 of the resolved processing configuration.
  bytes configuration_sha256 = 9;
}

// Canonical envelope used for live delivery and replay.
message StreamEvent {
  // Identity used for ordering and deduplication.
  Cursor cursor = 1;
  // Identity of the stage that created this payload, preserved through relays.
  Producer producer = 2;
  // Wall-clock event creation time, not a media presentation timestamp.
  google.protobuf.Timestamp emitted_at = 3;
  // Typed payload; no JSON representation on the wire.
  oneof payload {
    // First event; confirms the resolved stream UUID and limits.
    StreamOpened opened = 4;
    // Exact source bytes, retained independently of derived representations.
    SourceChunk source = 5;
    // Decoded PCM for a downstream speech service.
    AudioChunk audio = 6;
    // Revision of one timed speech segment.
    TranscriptSegment transcript = 7;
    // Exactly one terminal event on normal protocol completion or processing failure.
    StreamClosed closed = 8;
    // Container and track metadata as discovered by the native demuxer.
    MediaInfo media_info = 9;
    // Compressed packet fragment; original source bytes remain authoritative.
    EncodedPacket packet = 10;
    // Provisional window-level result; overlapping windows may repeat text.
    SpeechHypothesis hypothesis = 11;
    // HTTP status and sanitized origin; excludes URL query and user credentials.
    HttpResponseInfo http_info = 12;
  }
}

// Metadata for the HTTP response entity used as original source bytes.
message HttpResponseInfo {
  // Canonical scheme, host and explicit port, without path or query.
  string origin = 1;
  // HTTP response status. Transport failures may have no response metadata.
  uint32 status_code = 2;
}

// Accepted stream declaration and its negotiated limits.
message StreamOpened {
  // Sanitized source description; excludes URLs with secrets and credentials.
  DirectSource source = 1;
  // Largest accepted source message in bytes.
  uint32 max_chunk_bytes = 2;
  // Upper bound on per-stream retained event bytes, not a durability guarantee.
  uint64 retention_bytes = 3;
  // Resolved, accepted speech tasks.
  repeated SpeechOptions speech = 4;
  // Accepted native output projections; speech may also decode audio internally.
  DecodeOptions decode = 5;
}

// A metadata entry from a native dictionary; bytes preserve non-UTF-8 values.
message NativeMetadata {
  // Original key bytes.
  bytes key = 1;
  // Original value bytes.
  bytes value = 2;
}

// Native side data, retaining its numeric type and raw payload.
message SideData {
  // Native library's type identifier, interpreted using producer library_version.
  int32 native_type = 1;
  // Library-provided type name, empty if unknown.
  string type_name = 2;
  // Exact side-data bytes.
  bytes data = 3;
}

// Integer media time base; timestamps are ticks multiplied by this ratio.
message Rational {
  // Signed numerator.
  int32 numerator = 1;
  // Nonzero denominator.
  int32 denominator = 2;
}

// Native track category, distinct from the codec used for its packets.
enum TrackKind {
  // Unknown or unsupported native category; native_type still preserves it.
  TRACK_KIND_UNSPECIFIED = 0;
  // Audio track.
  TRACK_KIND_AUDIO = 1;
  // Video track.
  TRACK_KIND_VIDEO = 2;
  // Subtitle track.
  TRACK_KIND_SUBTITLE = 3;
  // Timed data track.
  TRACK_KIND_DATA = 4;
  // Container attachment.
  TRACK_KIND_ATTACHMENT = 5;
}

// Current native description of one track; source bytes preserve unexposed fields.
message TrackInfo {
  // Zero-based container track index.
  uint32 track_id = 1;
  // Native track identifier, which need not equal its zero-based index.
  int32 native_id = 2;
  // Track category.
  TrackKind kind = 3;
  // Original native media type identifier.
  int32 native_type = 4;
  // Codec identifier in the producing library version.
  int32 codec_id = 5;
  // Library-provided codec name.
  string codec_name = 6;
  // Container-specific codec tag.
  uint32 codec_tag = 7;
  // Codec initialization bytes, including information needed to decode packets.
  bytes codec_extradata = 8;
  // Time base for native timestamps.
  Rational time_base = 9;
  // First timestamp if known, in native ticks.
  optional int64 start_time = 10;
  // Track duration if known, in native ticks.
  optional int64 duration = 11;
  // Original metadata entries.
  repeated NativeMetadata metadata = 12;
  // Source audio sample rate, zero when not yet known or not audio.
  uint32 sample_rate = 13;
  // Source channel count, zero when not yet known or not audio.
  uint32 channels = 14;
  // Source pixel width, zero when not yet known or not video.
  uint32 width = 15;
  // Source pixel height, zero when not yet known or not video.
  uint32 height = 16;
  // Native track disposition bitmask, retained without interpretation.
  uint32 disposition_flags = 17;
  // Bitrate reported by the demuxer, zero when unknown.
  int64 bit_rate = 18;
  // Profile reported by the codec, including its native unknown sentinel.
  int32 profile = 19;
  // Level reported by the codec, including its native unknown sentinel.
  int32 level = 20;
  // Native track-level side data, including display matrices and codec metadata.
  // Preserved separately from per-packet side data without interpretation loss.
  repeated SideData side_data = 21;
}

// Native container facts. Updated descriptions supersede prior descriptions.
message MediaInfo {
  // Demuxer name identifying the parsed container family.
  string container_name = 1;
  // Human-readable library-provided format description.
  string container_description = 2;
  // Source timeline origin in microseconds, when known.
  optional int64 start_time_us = 3;
  // Container duration in microseconds, when known.
  optional int64 duration_us = 4;
  // Original container metadata entries.
  repeated NativeMetadata metadata = 5;
  // All tracks discovered so far, including non-audio tracks.
  repeated TrackInfo tracks = 6;
}

// One bounded fragment of a demuxed packet; fragments are contiguous and ordered.
message EncodedPacket {
  // Contiguous packet number across this input, beginning at one.
  uint64 packet_number = 1;
  // Container track index.
  uint32 track_id = 2;
  // Offset of this fragment within the packet payload.
  uint64 fragment_offset = 3;
  // Total unfragmented packet payload length; zero permits side-data-only packets.
  uint64 packet_bytes = 4;
  // Exact bytes of this packet fragment.
  bytes data = 5;
  // Original presentation timestamp when available.
  optional int64 pts = 6;
  // Original decode timestamp when available.
  optional int64 dts = 7;
  // Original packet duration in native ticks.
  int64 duration = 8;
  // Time base used by pts, dts and duration.
  Rational time_base = 9;
  // Original packet flags from the producing native library.
  uint32 native_flags = 10;
  // Whether the native demuxer marked this packet as a keyframe.
  bool keyframe = 11;
  // Original source byte position when known; omitted if the demuxer cannot report it.
  optional int64 source_byte_position = 12;
  // Native side data, attached only to the first fragment.
  repeated SideData side_data = 13;
}

// Sample-aligned audio data; the original source is never replaced by this projection.
message AudioChunk {
  // Contiguous chunk number within this decoded audio track, starting at one.
  uint64 chunk_number = 1;
  // Container track number.
  uint32 track_id = 2;
  // Sample index on the decoded track timeline.
  uint64 first_sample = 3;
  // Samples per channel per second.
  uint32 sample_rate = 4;
  // Channel count; PCM is interleaved.
  uint32 channels = 5;
  // IEEE-754 float32 little-endian PCM bytes, including complete sample frames only.
  bytes pcm_f32le = 6;
  // Presentation time when known, in microseconds from the source timeline origin.
  optional int64 presentation_time_us = 7;
  // True when the source timeline discontinuously changed before this chunk.
  bool discontinuity = 8;
}

// A model-generated segment; revisions supersede the same segment UUID.
message TranscriptSegment {
  // Stable UUID across partial and final revisions.
  string segment_id = 1;
  // Increasing revision number, starting at one.
  uint64 revision = 2;
  // Final revisions are immutable.
  bool final = 3;
  // Source audio track number.
  uint32 track_id = 4;
  // Source timeline start, in microseconds.
  int64 start_us = 5;
  // Source timeline end, in microseconds.
  int64 end_us = 6;
  // Exact engine text in raw hypotheses; reconciled text in derived revisions.
  string text = 7;
  // Detected or configured source language.
  string source_language = 8;
  // Language of the result text.
  string output_language = 9;
  // Task that generated the text.
  SpeechTask task = 10;
  // Mean token log probability when the engine reports it.
  optional double average_log_probability = 11;
  // Engine tokens, preserving IDs and timings instead of inventing word boundaries.
  repeated SpeechToken tokens = 12;
  // Whether overlap text was aligned, needed no alignment, or remains ambiguous.
  ReconciliationStatus reconciliation = 13;
  // Producer of this derived revision; absent on raw native segments.
  Producer producer = 14;
  // Native inference and window selection contributors.
  repeated Producer contributors = 15;
}

// Evidence supporting a rendered transcript revision, distinct from ASR accuracy.
enum ReconciliationStatus {
  // Native hypothesis; reconciliation has not been attempted.
  RECONCILIATION_STATUS_UNSPECIFIED = 0;
  // No competing recognized text needed overlap alignment.
  RECONCILIATION_STATUS_DIRECT = 1;
  // Overlap was joined using lexical and temporal evidence.
  RECONCILIATION_STATUS_ALIGNED = 2;
  // No unique safe join was established; competing text is retained explicitly.
  RECONCILIATION_STATUS_UNRESOLVED = 3;
  // Provisional tail awaiting more source context.
  RECONCILIATION_STATUS_PENDING = 4;
}

// A token emitted by the native inference API.
message SpeechToken {
  // Engine vocabulary ID.
  int32 token_id = 1;
  // Exact token text bytes; a token need not independently be valid UTF-8.
  bytes text = 2;
  // Native token probability when available.
  optional float probability = 3;
  // Source timeline start when available, in microseconds.
  optional int64 start_us = 4;
  // Source timeline end when available, in microseconds.
  optional int64 end_us = 5;
  // Distinguishes lexical text from model control/timestamp tokens.
  SpeechTokenKind kind = 6;
  // Native Whisper values, preserving confidence and timing diagnostics.
  WhisperTokenMetadata whisper = 7;
  // Native detokenized contribution; derived revisions may restore word spacing.
  // Absent means use text bytes.
  // May be empty or a partial UTF-8 sequence; concatenate before validation.
  optional bytes rendered_text = 8;
  // Native Parakeet duration, alignment and confidence values.
  ParakeetTokenMetadata parakeet = 9;
}

// Semantic role of a model token; control tokens are retained but not rendered.
enum SpeechTokenKind {
  // The backend did not classify this token.
  SPEECH_TOKEN_KIND_UNSPECIFIED = 0;
  // Lexical text contributing bytes to the segment text.
  SPEECH_TOKEN_KIND_TEXT = 1;
  // Model control, language, task or timestamp token.
  SPEECH_TOKEN_KIND_CONTROL = 2;
}

// Native whisper_token_data fields not represented by generic token metadata.
message WhisperTokenMetadata {
  // Forced timestamp token vocabulary ID.
  int32 timestamp_token_id = 1;
  // Native lexical token log probability.
  float log_probability = 2;
  // Probability of the timestamp token.
  float timestamp_probability = 3;
  // Sum of probabilities over timestamp tokens.
  float timestamp_probability_sum = 4;
  // Native window-relative start in centiseconds, only when timing was computed.
  optional int64 start_centiseconds = 5;
  // Native window-relative end in centiseconds, only when timing was computed.
  optional int64 end_centiseconds = 6;
  // Native voice-length diagnostic, only when token timing was computed.
  optional float voice_length = 7;
}

// Native parakeet_token_data fields not represented by generic token metadata.
message ParakeetTokenMetadata {
  // Index in the model duration vocabulary.
  int32 duration_index = 1;
  // Predicted duration value.
  int32 duration_value = 2;
  // Native encoder frame index.
  int32 frame_index = 3;
  // Native token log probability.
  float log_probability = 4;
  // Native window-relative start in centiseconds.
  int64 start_centiseconds = 5;
  // Native window-relative end in centiseconds.
  int64 end_centiseconds = 6;
  // Native word-boundary marker.
  bool is_word_start = 7;
}

// Native speech inference engine, independent of model ID and device.
enum SpeechBackendKind {
  // Engine not reported.
  SPEECH_BACKEND_KIND_UNSPECIFIED = 0;
  // whisper.cpp Whisper model adapter.
  SPEECH_BACKEND_KIND_WHISPER = 1;
  // whisper.cpp Parakeet model adapter.
  SPEECH_BACKEND_KIND_PARAKEET = 2;
}

// Final stream accounting; downstream processing drains before successful closure.
message StreamClosed {
  // Zero for success; otherwise the canonical gRPC status code.
  int32 status_code = 1;
  // Diagnostic with source secrets excluded.
  string message = 2;
  // Total accepted source chunks.
  uint64 source_chunk_count = 3;
  // Total accepted source bytes.
  uint64 source_byte_count = 4;
  // SHA-256 of all accepted source bytes, even for a failed partial stream.
  bytes source_sha256 = 5;
}

// Native inference worker. The caller owns VAD, windowing and reconciliation.
service SpeechWorkerService {
  // Inspect the loaded native model without allocating a transcription stream.
  rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);
  // Open one track, submit numbered windows, and explicitly finish.
  rpc Transcribe(stream TranscribeRequest) returns (stream TranscribeResponse);
}

// The worker currently hosts one operator-provisioned model.
message GetModelInfoRequest {}

// Loaded model identity and capabilities derived from the model itself.
message GetModelInfoResponse {
  // Includes model ID, weights SHA-256, native library and application versions.
  Producer producer = 1;
  // True for multilingual weights, false for English-only when capability is known.
  // Consult multilingual_known for backends that cannot inspect this property.
  bool multilingual = 2;
  // Tasks accepted by this loaded model.
  repeated SpeechTask tasks = 3;
  // Maximum samples in one inference window.
  uint32 max_window_samples = 4;
  // Required mono PCM sample rate.
  uint32 sample_rate_hz = 5;
  // Maximum open transcription streams, including idle streams.
  uint32 max_streams = 6;
  // Maximum simultaneous inference calls; excess calls fail RESOURCE_EXHAUSTED.
  uint32 max_concurrent_inferences = 7;
  // Configured CPU threads per inference.
  uint32 inference_threads = 8;
  // Maximum wait for each incoming message, including open; excludes inference.
  // Expiry cancels the RPC and releases its stream slot.
  uint32 input_idle_timeout_ms = 9;
  // Native inference engine.
  SpeechBackendKind backend = 10;
  // Whether nonempty language hints are accepted.
  bool accepts_language_hint = 11;
  // Whether transcript language labels are supplied by the backend.
  bool reports_language = 12;
  // Whether multilingual was determined from the loaded model.
  bool multilingual_known = 13;
  // Minimum native encoder context, when the backend applies one. This is
  // model-only padding, not additional source audio or input buffering.
  optional uint32 minimum_encoder_context_ms = 14;
}

// One worker input message; audio windows already contain any intended overlap.
message TranscribeRequest {
  // Strict open, windows, finish lifecycle.
  oneof payload {
    // Required first and exactly once.
    SpeechWorkerOpen open = 1;
    // Complete bounded inference window; never overlapped again by the worker.
    InferenceWindow window = 2;
    // Required after the last window, including an empty track.
    SpeechWorkerFinish finish = 3;
  }
}

// One source track and model invocation configuration.
message SpeechWorkerOpen {
  // Source stream UUID assigned by the ingress service.
  string stream_id = 1;
  // Source container track index.
  uint32 track_id = 2;
  // Model/task/language options; windowing must be absent because windows are supplied.
  SpeechOptions options = 3;
}

// Why this inference window ended.
enum InferenceBoundary {
  // Invalid in a submitted window.
  INFERENCE_BOUNDARY_UNSPECIFIED = 0;
  // Configured fixed duration.
  INFERENCE_BOUNDARY_FIXED = 1;
  // Confirmed pause, according to the upstream VAD.
  INFERENCE_BOUNDARY_PAUSE = 2;
  // Hard duration limit without a confirmed pause.
  INFERENCE_BOUNDARY_FORCED = 3;
  // End of source audio.
  INFERENCE_BOUNDARY_END = 4;
  // Source timeline discontinuity immediately follows this window.
  INFERENCE_BOUNDARY_DISCONTINUITY = 5;
}

// One complete mono 16 kHz PCM window, at most 30 seconds.
message InferenceWindow {
  // Contiguous per-worker-stream number, beginning at one.
  uint64 window_number = 1;
  // Absolute first sample on the source track's decoded timeline.
  uint64 first_sample = 2;
  // First sample not covered by earlier windows; explicitly identifies overlap.
  uint64 first_new_sample = 3;
  // IEEE-754 float32 little-endian samples, with no transport padding.
  bytes pcm_f32le = 4;
  // Explicit reason supplied by the upstream window selection stage.
  InferenceBoundary boundary = 5;
}

// Explicit worker-stream accounting.
message SpeechWorkerFinish {
  // Total submitted windows, including those with no recognized speech.
  uint64 window_count = 1;
}

// Worker output, ordered within the one source track.
message TranscribeResponse {
  // Handshake, one hypothesis per window, then successful close.
  oneof payload {
    // Accepted configuration and actual model identity.
    SpeechWorkerOpened opened = 1;
    // Complete hypothesis for one input window, possibly containing no segments.
    SpeechHypothesis hypothesis = 2;
    // All windows have been processed; does not finalize reconciled transcripts.
    SpeechWorkerFinish closed = 3;
  }
}

// Worker identity and accepted configuration.
message SpeechWorkerOpened {
  // Echoed source and accepted options; task defaults are resolved.
  SpeechWorkerOpen accepted = 1;
  // Actual server/model provenance, including weights and settings hashes.
  Producer producer = 2;
  // Largest accepted PCM sample count per inference window.
  uint32 max_window_samples = 3;
}

// Unreconciled native model output. Overlapping windows may repeat speech.
message SpeechHypothesis {
  // Input window whose inference completed.
  uint64 window_number = 1;
  // Source track; no cross-track inference state is shared.
  uint32 track_id = 2;
  // Native segments are provisional; the upstream reconciler owns finalization.
  repeated TranscriptSegment segments = 3;
  // Absolute first sample of the input window on its decoded track.
  uint64 first_sample = 4;
  // First sample not included in previous windows.
  uint64 first_new_sample = 5;
  // Real input samples, excluding model padding.
  uint32 sample_count = 6;
  // Boundary chosen by the windowing stage.
  InferenceBoundary boundary = 7;
  // Native worker provenance, retained in hydrated state as well as live events.
  Producer producer = 8;
  // Upstream processors contributing window selection, including VAD when used.
  repeated Producer contributors = 9;
  // Native presentation time of the first window sample, when known. When
  // absent, segment times remain relative to the decoded sample timeline.
  optional int64 presentation_time_us = 10;
  // Actual analysis and encoder sizes when the backend exposes them.
  EncoderContext encoder_context = 11;
}

// Model-only preparation; SpeechHypothesis.sample_count remains the real input.
message EncoderContext {
  // PCM samples supplied to feature extraction, including synthetic zero padding.
  uint32 analysis_samples = 1;
  // Feature frames generated from analysis_samples, including centered padding.
  uint32 feature_frames = 2;
  // Encoder input frames; extra frames are zeros and masked from attention keys.
  uint32 encoder_frames = 3;
  // Samples per feature-frame step at the reported worker sample rate.
  uint32 frame_hop_samples = 4;
}
